<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Element Snapper</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-container">
      <div class="views-wrapper">
        <!-- Home View -->
        <div class="view view-home" id="homeView">
          <header class="header">
            <div class="brand">
              <svg
                width="22"
                height="22"
                viewBox="0 0 28 28"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                class="brand-logo"
              >
                <!-- Outer dashed bounding box -->
                <rect
                  x="3"
                  y="3"
                  width="22"
                  height="22"
                  rx="4"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-dasharray="4 2"
                  class="logo-dash"
                />
                <!-- Top Left Crop -->
                <path
                  d="M3 9V7C3 4.79086 4.79086 3 7 3H9"
                  stroke="var(--accent-primary)"
                  stroke-width="2"
                  stroke-linecap="round"
                />
                <!-- Top Right Crop -->
                <path
                  d="M25 9V7C25 4.79086 23.2091 3 21 3H19"
                  stroke="var(--accent-primary)"
                  stroke-width="2"
                  stroke-linecap="round"
                />
                <!-- Bottom Left Crop -->
                <path
                  d="M3 19V21C3 23.2091 4.79086 25 7 25H9"
                  stroke="var(--accent-primary)"
                  stroke-width="2"
                  stroke-linecap="round"
                />
                <!-- Bottom Right Crop -->
                <path
                  d="M25 19V21C25 23.2091 23.2091 25 21 25H19"
                  stroke="var(--accent-primary)"
                  stroke-width="2"
                  stroke-linecap="round"
                />
                <!-- Inner Camera Lens -->
                <circle cx="14" cy="14" r="5" fill="var(--accent-primary)" />
                <circle cx="14" cy="14" r="2" fill="var(--bg-dark)" />
              </svg>
              <h1>Element Snapper</h1>
            </div>
            <div class="header-controls">
              <div class="status-pill idle" id="statusPill">
                <span class="status-dot"></span>
                <span class="status-text" id="statusText">Ready</span>
              </div>
              <button class="icon-btn" id="settingsBtn" aria-label="Settings">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M10.3246 4.31731C10.751 2.5609 13.249 2.5609 13.6754 4.31731C13.9508 5.45193 15.2507 5.99038 16.2478 5.38228C17.7913 4.44105 19.5589 6.2087 18.6177 7.75218C18.0096 8.74925 18.5481 10.0492 19.6827 10.3246C21.4391 10.751 21.4391 13.249 19.6827 13.6754C18.5481 13.9508 18.0096 15.2507 18.6177 16.2478C19.5589 17.7913 17.7913 19.5589 16.2478 18.6177C15.2507 18.0096 13.9508 18.5481 13.6754 19.6827C13.249 21.4391 10.751 21.4391 10.3246 19.6827C10.0492 18.5481 8.74926 18.0096 7.75219 18.6177C6.2087 19.5589 4.44105 17.7913 5.38228 16.2478C5.99038 15.2507 5.45193 13.9508 4.31731 13.6754C2.5609 13.249 2.5609 10.751 4.31731 10.3246C5.45193 10.0492 5.99038 8.74926 5.38228 7.75219C4.44105 6.2087 6.2087 4.44105 7.75219 5.38228C8.74926 5.99038 10.0492 5.45193 10.3246 4.31731Z"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M15 12C15 13.6569 13.6569 15 12 15C10.3431 15 9 13.6569 9 12C9 10.3431 10.3431 9 12 9C13.6569 9 15 10.3431 15 12Z"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
          </header>

          <main class="main-content">
            <button class="capture-btn" id="captureBtn" data-state="idle">
              <div class="btn-content">
                <div class="btn-icon">
                  <svg
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M4 4H10V6H6V10H4V4ZM20 4V10H18V6H14V4H20ZM4 20V14H6V18H10V20H4ZM20 20H14V18H18V14H20V20ZM12 8C14.2091 8 16 9.79086 16 12C16 14.2091 14.2091 16 12 16C9.79086 16 8 14.2091 8 12C8 9.79086 9.79086 8 12 8Z"
                      fill="currentColor"
                    />
                  </svg>
                </div>
                <span class="btn-label" id="btnLabel">Select Element</span>
              </div>
              <div class="btn-loading">
                <svg class="spinner" viewBox="0 0 50 50">
                  <circle
                    class="path"
                    cx="25"
                    cy="25"
                    r="20"
                    fill="none"
                    stroke-width="5"
                  ></circle>
                </svg>
              </div>
            </button>

            <div class="action-buttons">
              <button class="action-btn" id="captureViewportBtn">
                <span>Screen Shot</span>
              </button>
              <button class="action-btn" id="captureFullPageBtn">
                <span>Full Page</span>
              </button>
            </div>

            <div class="switch-group">
              <label class="switch-row">
                <div class="switch-content">
                  <span class="switch-label">Clipboard</span>
                  <span class="switch-desc">Copy instead of download</span>
                </div>
                <input
                  type="checkbox"
                  id="clipboardCheckbox"
                  class="switch-input"
                />
                <div class="toggle-switch"></div>
              </label>
            </div>
          </main>
        </div>

      <!-- Settings View -->
      <div class="view view-settings" id="settingsView">
        <header class="header">
          <div class="brand">
            <button class="icon-btn" id="backBtn" aria-label="Back">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M15 18L9 12L15 6"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <h1>Settings</h1>
          </div>
          <div class="header-controls">
            <a
              href="https://element-snapper.pakool.com/#how-it-works"
              target="_blank"
              class="icon-btn"
              aria-label="How it works"
              title="How it works"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <circle
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <path
                  d="M12 16v-4M12 8h.01"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </a>
          </div>
        </header>

        <main class="main-content">
          <div class="settings-container">
            <div class="setting-group">
              <label class="setting-label">Format</label>
              <div class="toggle-group">
                <input
                  type="radio"
                  name="format"
                  id="fmt-png"
                  value="png"
                  checked
                />
                <label for="fmt-png" class="toggle-option">PNG</label>
                <input type="radio" name="format" id="fmt-jpg" value="jpg" />
                <label for="fmt-jpg" class="toggle-option">JPG</label>
              </div>
            </div>

            <div class="setting-group setting-row">
              <label class="setting-label">Quality</label>
              <input
                type="range"
                id="qualityInput"
                min="1"
                max="100"
                value="95"
                class="slider"
                style="--val: 95%"
              />
              <span id="qualityValue" class="slider-value">95%</span>
            </div>

            <div class="setting-group setting-row">
              <label class="setting-label">Delay</label>
              <input
                type="range"
                id="delayInput"
                min="0"
                max="10"
                value="0"
                class="slider"
                style="--val: 0%"
              />
              <span id="delayValue" class="slider-value">0s</span>
            </div>

            <div class="switch-group">
              <label class="switch-row">
                <div class="switch-content">
                  <span class="switch-label">Scroll Element</span>
                  <span class="switch-desc">Capture scrollable content</span>
                </div>
                <input
                  type="checkbox"
                  id="fullCaptureCheckbox"
                  class="switch-input"
                />
                <div class="toggle-switch"></div>
              </label>

              <!-- Debug Mode hidden - available via dev mode environment variable -->
              <input
                type="checkbox"
                id="debugModeCheckbox"
                class="switch-input"
                style="display: none"
              />
            </div>

            <a
              href="https://buymeacoffee.com/panat.siriwong"
              target="_blank"
              class="bmc-btn"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M8 17H16C17.6569 17 19 15.6569 19 14V12H21V7H19V4H5V7H3V12H5V14C5 15.6569 6.34315 17 8 17ZM7 4H17V12H7V4ZM3 9H5V10H3V9ZM19 10V9H21V10H19ZM16 19H8V21H16V19Z"
                  fill="currentColor"
                />
              </svg>
              <span>Buy me a coffee</span>
            </a>
          </div>
        </main>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
