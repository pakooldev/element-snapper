<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit capture · Element Snapper</title>
  <link rel="icon" href="../icons/icon48.png">
  <link rel="stylesheet" href="editor.css">
  <style>
    body { display: flex; flex-direction: column; overflow: hidden; }

    .name {
      width: 260px;
      min-width: 0;
      padding: 6px 8px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font: inherit;
      font-weight: 600;
      text-overflow: ellipsis;
    }
    .name:hover { border-color: var(--border-light); }
    .name:focus { border-color: var(--accent-primary); background: var(--bg-dark); outline: none; }

    .zoom { display: flex; align-items: center; gap: 2px; margin: 0 4px; }
    .zoom button { padding: 6px 8px; }
    #zoomLabel { min-width: 58px; font-variant-numeric: tabular-nums; color: var(--text-secondary); }

    .workspace { flex: 1; display: flex; min-height: 0; }

    .stage { position: relative; flex: 1; min-width: 0; overflow: hidden; background: var(--canvas); }
    #board { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    .stage.dropping::after {
      content: 'Drop to add the image';
      position: absolute;
      inset: 12px;
      display: grid;
      place-items: center;
      border: 2px dashed var(--accent-primary);
      border-radius: var(--radius-md);
      background: rgba(59, 130, 246, 0.08);
      color: var(--text-primary);
      font-weight: 600;
      pointer-events: none;
    }

    .message {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.6;
    }

    /* Second bar: tools, then the style of the selection or of what the tool draws. */
    .options { height: 48px; gap: 10px; }
    .tools {
      display: flex;
      gap: 2px;
      padding: 3px;
      background: var(--bg-dark);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
    }
    .tools button { padding: 5px 7px; background: transparent; border-color: transparent; }
    .tools button:hover:not(:disabled) { background: var(--bg-hover); border-color: transparent; }
    .tools button[aria-pressed="true"] { background: var(--accent-primary); }
    .tools button[aria-pressed="true"]:hover { background: var(--accent-hover); }
    .tools .divider { width: 1px; margin: 4px 3px; background: var(--border-light); }
    .options .divider { width: 1px; height: 24px; background: var(--border-light); }
    .options .group { display: flex; align-items: center; gap: 8px; }
    .options .label { color: var(--text-secondary); font-size: 12px; }
    .options .info { color: var(--text-secondary); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .options .info strong { color: var(--text-primary); font-weight: 600; margin-right: 4px; }
    .options .delete:hover:not(:disabled) { color: var(--error); }

    .picker {
      position: absolute;
      top: 8px;
      left: 12px;
      width: min(420px, calc(100% - 24px));
      padding: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
    .picker h3 { margin-bottom: 8px; color: var(--text-secondary); font-size: 12px; font-weight: 600; }
    .picker-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      max-height: 220px;
      overflow: auto;
      margin-bottom: 10px;
    }
    .picker-grid button { padding: 0; aspect-ratio: 4 / 3; overflow: hidden; }
    .picker-grid img { width: 100%; height: 100%; object-fit: contain; }
    .picker-empty { color: var(--text-secondary); font-size: 12px; margin-bottom: 10px; }
    .picker .file { width: 100%; }

    /* What the tool does, at the bottom of the board. */
    .hint {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 24px);
      padding: 6px 12px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-size: 12px;
      text-align: center;
      pointer-events: none;
    }
    .hint:empty { display: none; }

    .swatches { display: flex; gap: 6px; }
    .swatch {
      position: relative;
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid var(--border-hover);
      background: var(--c);
    }
    .swatch:hover:not(:disabled) { background: var(--c); border-color: var(--text-secondary); }
    .swatch[aria-pressed="true"] { border-color: var(--text-primary); box-shadow: 0 0 0 2px var(--accent-primary); }
    .swatch.custom { background: conic-gradient(#ef4444, #facc15, #22c55e, #3b82f6, #a855f7, #ef4444); overflow: hidden; cursor: pointer; }
    .swatch.custom:hover { border-color: var(--text-secondary); }
    .swatch.custom.picked { border-color: var(--text-primary); box-shadow: 0 0 0 2px var(--accent-primary); }
    .swatch.custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

    .segmented {
      display: flex;
      gap: 2px;
      padding: 3px;
      background: var(--bg-dark);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
    }
    .segmented button { min-width: 30px; padding: 3px 6px; background: transparent; border-color: transparent; }
    .segmented button:hover:not(:disabled) { background: var(--bg-hover); border-color: transparent; }
    .segmented button[aria-pressed="true"] { background: var(--accent-primary); }
    .segmented svg.icon { width: 28px; }

    .text-input {
      position: absolute;
      padding: 0;
      background: rgba(15, 23, 42, 0.35);
      border: 1px dashed var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      line-height: 1.2;
      outline: none;
    }

  </style>
</head>
<body>
  <header class="bar">
    <button id="homeBtn" class="ghost icon-only" title="My edits" aria-label="My edits">
      <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
    </button>
    <input id="name" class="name" aria-label="Name" spellcheck="false" disabled>
    <span class="spacer"></span>
    <button id="undo" class="ghost icon-only" disabled title="Undo (⌘Z / Ctrl+Z)" aria-label="Undo">
      <svg class="icon" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button id="redo" class="ghost icon-only" disabled title="Redo (⇧⌘Z / Ctrl+Shift+Z)" aria-label="Redo">
      <svg class="icon" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
    </button>
    <div class="zoom">
      <button id="zoomOut" class="ghost" title="Zoom out (⌘−)" aria-label="Zoom out">−</button>
      <button id="zoomLabel" class="ghost" title="Zoom to fit (⇧1)">100%</button>
      <button id="zoomIn" class="ghost" title="Zoom in (⌘+)" aria-label="Zoom in">+</button>
    </div>
    <button id="copy" disabled>
      <svg class="icon" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
      Copy
    </button>
    <button id="download" class="primary" disabled>
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      Download
    </button>
  </header>

  <div class="bar options">
    <div class="tools" role="toolbar" aria-label="Tools">
      <button data-tool="select" aria-pressed="true" title="Select and move (V)" aria-label="Select">
        <svg class="icon" viewBox="0 0 24 24"><path d="M6 3l12 9-5.5 1-3 6z"/></svg>
      </button>
      <button data-tool="hand" aria-pressed="false" title="Move the board (H, or hold Space)" aria-label="Hand">
        <svg class="icon" viewBox="0 0 24 24"><path d="M8 12V6a1.5 1.5 0 0 1 3 0v5M11 11V4.5a1.5 1.5 0 0 1 3 0V11M14 11V6a1.5 1.5 0 0 1 3 0v7c0 4-2.5 7-6 7-2.4 0-3.8-1.1-5.2-3.2L3.6 13.4a1.5 1.5 0 0 1 2.5-1.7L8 14"/></svg>
      </button>
      <span class="divider"></span>
      <button data-tool="crop" aria-pressed="false" title="Crop: drag to set the frame (C)" aria-label="Crop">
        <svg class="icon" viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M2 6h14a2 2 0 0 1 2 2v14"/></svg>
      </button>
      <span class="divider"></span>
      <button data-tool="box" aria-pressed="false" title="Box (R)" aria-label="Box">
        <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1.5"/></svg>
      </button>
      <button data-tool="arrow" aria-pressed="false" title="Arrow: drag from the tail to the tip (A)" aria-label="Arrow">
        <svg class="icon" viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg>
      </button>
      <button data-tool="text" aria-pressed="false" title="Text: click to type (T)" aria-label="Text">
        <svg class="icon" viewBox="0 0 24 24"><path d="M5 7V4h14v3M12 4v16M9 20h6"/></svg>
      </button>
      <span class="divider"></span>
      <button data-tool="blur" aria-pressed="false" title="Blur: pixelate an area (B)" aria-label="Blur">
        <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/><rect x="4" y="4" width="8" height="8" fill="currentColor" stroke="none" opacity=".45"/><rect x="12" y="12" width="8" height="8" fill="currentColor" stroke="none" opacity=".45"/></svg>
      </button>
      <button data-tool="redact" aria-pressed="false" title="Redact: black out an area (X)" aria-label="Redact">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 5h10M4 19h13"/><rect x="3" y="9" width="18" height="6" rx="1" fill="currentColor"/></svg>
      </button>
    </div>
    <button id="imageBtn" aria-expanded="false" title="Add an image (or paste / drop one)" aria-label="Add an image" class="ghost">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-9 9"/></svg>
      Image
    </button>
    <span class="divider"></span>
    <section id="colorSection" class="group" aria-label="Color">
      <div class="swatches">
        <button class="swatch" data-color="#ef4444" style="--c:#ef4444" title="Red" aria-label="Red"></button>
        <button class="swatch" data-color="#f97316" style="--c:#f97316" title="Orange" aria-label="Orange"></button>
        <button class="swatch" data-color="#facc15" style="--c:#facc15" title="Yellow" aria-label="Yellow"></button>
        <button class="swatch" data-color="#22c55e" style="--c:#22c55e" title="Green" aria-label="Green"></button>
        <button class="swatch" data-color="#3b82f6" style="--c:#3b82f6" title="Blue" aria-label="Blue"></button>
        <button class="swatch" data-color="#a855f7" style="--c:#a855f7" title="Purple" aria-label="Purple"></button>
        <button class="swatch" data-color="#000000" style="--c:#000000" title="Black" aria-label="Black"></button>
        <button class="swatch" data-color="#ffffff" style="--c:#ffffff" title="White" aria-label="White"></button>
        <label class="swatch custom" title="Other color" id="customSwatch"><input id="customColor" type="color" value="#ef4444" aria-label="Other color"></label>
      </div>
    </section>
    <section id="sizeSection" class="group">
      <span id="sizeLabel" class="label">Stroke</span>
      <div class="segmented">
        <button data-size="s" title="Thin">S</button>
        <button data-size="m" title="Medium">M</button>
        <button data-size="l" title="Thick">L</button>
      </div>
    </section>
    <section id="dashSection" class="group" aria-label="Line style">
      <div class="segmented">
        <button data-dash="solid" title="Solid" aria-label="Solid"><svg class="icon" viewBox="0 0 28 24"><path d="M3 12h22"/></svg></button>
        <button data-dash="dashed" title="Dashed" aria-label="Dashed"><svg class="icon" viewBox="0 0 28 24"><path d="M3 12h22" stroke-linecap="butt" stroke-dasharray="5 3"/></svg></button>
        <button data-dash="dotted" title="Dotted" aria-label="Dotted"><svg class="icon" viewBox="0 0 28 24"><path d="M3 12h22" stroke-dasharray="0 5"/></svg></button>
      </div>
    </section>
    <span class="spacer"></span>
    <p class="info"><strong id="designTitle">Select</strong><span id="designInfo"></span></p>
    <button id="deleteBtn" class="delete ghost" hidden>
      <svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
      Delete
    </button>
  </div>

  <div class="workspace">
    <main class="stage" id="stage">
      <canvas id="board" aria-label="Board: the frame is what gets copied or downloaded" tabindex="-1"></canvas>
      <p id="message" class="message">Loading…</p>
      <p id="designHint" class="hint"></p>

      <div id="picker" class="picker" hidden>
        <h3>From history</h3>
        <div id="pickerGrid" class="picker-grid"></div>
        <p id="pickerEmpty" class="picker-empty" hidden>No captures in history. You can also paste (⌘V) or drop an image on the board.</p>
        <button id="pickFile" class="file">Choose a file…</button>
        <input id="fileInput" type="file" accept="image/*" multiple hidden>
      </div>
    </main>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="store.js"></script>
  <script src="editor.js"></script>
</body>
</html>
