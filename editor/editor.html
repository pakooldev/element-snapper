<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit capture · Element Snapper</title>
  <link rel="icon" href="../icons/icon48.png">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --error: #ef4444;
      --border-light: rgba(255, 255, 255, 0.1);
      --border-hover: rgba(255, 255, 255, 0.2);
      --radius-sm: 6px;
      --radius-md: 12px;
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      display: flex;
      flex-direction: column;
      background: var(--bg-dark);
      color: var(--text-primary);
      font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-light);
    }

    .brand { font-weight: 600; margin-right: 8px; }
    .spacer { flex: 1; }
    .size { color: var(--text-secondary); font-size: 12px; font-variant-numeric: tabular-nums; }

    .tools {
      display: flex;
      gap: 2px;
      padding: 3px;
      background: var(--bg-dark);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s var(--ease), border-color 0.2s var(--ease);
    }
    button:hover:not(:disabled) { background: var(--bg-hover); border-color: var(--border-hover); }
    button:disabled { opacity: 0.4; cursor: default; }
    button:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: 2px; }

    .tools button { border-color: transparent; background: transparent; padding: 6px 10px; }
    .tools button[aria-pressed="true"] { background: var(--accent-primary); }
    .tools button[aria-pressed="true"]:hover { background: var(--accent-hover); }

    button.primary {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
      border-color: transparent;
    }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); }

    .stage {
      flex: 1;
      overflow: auto;
      display: flex;
      padding: 24px;
    }

    /* margin:auto centers it, and still lets a tall image scroll from its top. */
    .frame { position: relative; margin: auto; min-width: 0; max-width: 100%; line-height: 0; }

    .checker {
      background:
        linear-gradient(45deg, #1e293b 25%, transparent 25%),
        linear-gradient(-45deg, #1e293b 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1e293b 75%),
        linear-gradient(-45deg, transparent 75%, #1e293b 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    }

    #view { display: block; max-width: 100%; height: auto; }
    #sketch { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
    #sketch.text { cursor: text; }

    .text-input {
      position: absolute;
      min-width: 120px;
      padding: 0 2px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px dashed var(--text-primary);
      color: var(--error);
      font-weight: 600;
      line-height: 1.2;
      outline: none;
    }

    .message { margin: auto; color: var(--text-secondary); text-align: center; line-height: 1.6; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 12px);
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);
    }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { border-color: var(--error); }
  </style>
</head>
<body>
  <header class="bar">
    <span class="brand">Edit capture</span>
    <div class="tools" role="group" aria-label="Tool">
      <button data-tool="crop" aria-pressed="true" title="Drag to keep only that part">Crop</button>
      <button data-tool="box" aria-pressed="false" title="Drag to draw a box">Box</button>
      <button data-tool="arrow" aria-pressed="false" title="Drag from the tail to the tip">Arrow</button>
      <button data-tool="text" aria-pressed="false" title="Click to type a label">Text</button>
      <button data-tool="blur" aria-pressed="false" title="Drag to pixelate an area">Blur</button>
      <button data-tool="redact" aria-pressed="false" title="Drag to black out an area">Redact</button>
    </div>
    <button id="undo" disabled title="Undo (Ctrl+Z / ⌘Z)">Undo</button>
    <span id="size" class="size"></span>
    <span class="spacer"></span>
    <button id="copy" disabled>Copy</button>
    <button id="download" class="primary" disabled>Download</button>
  </header>
  <main class="stage">
    <div id="frame" class="frame checker" hidden>
      <canvas id="view"></canvas>
      <canvas id="sketch" aria-label="Capture being edited"></canvas>
    </div>
    <p id="message" class="message">Loading…</p>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="editor.js"></script>
</body>
</html>
